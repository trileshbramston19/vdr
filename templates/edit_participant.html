{% extends 'base.html' %}

{% block title %}Edit Participant{% endblock %}

{% block content %}
<h2 class="text-2xl font-semibold mb-6">Edit Participant</h2>

<form method="POST" class="max-w-md bg-white p-6 rounded shadow space-y-6">
    <div>
        <label for="name" class="block mb-1 font-medium">Name</label>
        <input type="text" id="name" name="name" value="{{ participant.name }}" required
               class="w-full px-3 py-2 border rounded focus:outline-none focus:ring-2 focus:ring-indigo-500" />
    </div>

    <div>
        <label for="email" class="block mb-1 font-medium">Email</label>
        <input type="email" id="email" name="email" value="{{ participant.email }}" required
               class="w-full px-3 py-2 border rounded focus:outline-none focus:ring-2 focus:ring-indigo-500" />
    </div>

    <div>
        <label for="group_name" class="block mb-1 font-medium">Group</label>
        <select id="group_name" name="group_name" required
                class="w-full px-3 py-2 border rounded focus:outline-none focus:ring-2 focus:ring-indigo-500">
            <option value="">-- Select Group --</option>
            {% for group in groups %}
                <option value="{{ group }}" {% if group == participant.group_name %}selected{% endif %}>{{ group }}</option>
            {% endfor %}
        </select>
    </div>

    <div>
        <label for="role" class="block mb-1 font-medium">Role</label>
        <select id="role" name="role" required
                class="w-full px-3 py-2 border rounded focus:outline-none focus:ring-2 focus:ring-indigo-500">
            <option value="User" {% if participant.role == 'User' %}selected{% endif %}>User</option>
            <option value="Admin" {% if participant.role == 'Admin' %}selected{% endif %}>Admin</option>
        </select>
    </div>

    <div>
        <label for="status" class="block mb-1 font-medium">Status</label>
        <select id="status" name="status" required
                class="w-full px-3 py-2 border rounded focus:outline-none focus:ring-2 focus:ring-indigo-500">
            <option value="Active" {% if participant.status == 'Active' %}selected{% endif %}>Active</option>
            <option value="Inactive" {% if participant.status == 'Inactive' %}selected{% endif %}>Inactive</option>
        </select>
    </div>

    <div class="flex space-x-4">
        <button type="submit" class="bg-indigo-600 text-white px-5 py-2 rounded hover:bg-indigo-700">Save Changes</button>
        <a href="{{ url_for('participants') }}" class="px-5 py-2 rounded bg-gray-300 hover:bg-gray-400">Cancel</a>
    </div>
</form>
{% endblock %}
